# TEST-tier mirror of ../dev/customer.yaml -- same per-domain schema, kept in a SEPARATE
# tier folder so DEV and TEST identity lifecycles are fully decoupled: onboarding a new
# domain to DEV doesn't require it to exist in TEST too, and vice versa. See
# domain_identities.tf / domain_identities_test.tf for how dev/ and test/ are each merged
# into one map (one Terraform file per domain, not one shared file for every domain --
# keeps onboarding domain #2+ from ever touching this file).
customer:
  dbt_service_user: "GITHUB_TEST_CUSTOMER_DBT_SVC"
  dbt_repo: "customer-domain-dbt"
  dbt_repo_label: "customer-domain-dbt (Repo 3)"
  dbt_repo_id: "1405522917"
  dbt_github_environment: "TEST-dbt"

  ingest_service_user: "GITHUB_TEST_CUSTOMER_INGEST_SVC"
  ingest_repo: "data-ingestion-raw"
  ingest_repo_label: "data-ingestion-raw (Repo 2)"
  ingest_repo_id: "1405785591"
  ingest_github_environment: "TEST-Ingest"
