name: Terraform Plan

# Deliberately DEV-only for this demo. There is no "choose an environment" dropdown here
# because selecting anything other than DEV would not actually work today: only the
# DEV-Terraform/DEV-DCM GitHub Environments and GITHUB_DEV_TERRAFORM_SVC/GITHUB_DEV_DCM_SVC
# OIDC identities exist (terraform/oidc_service_user.tf), and dcm/manifest.yml only defines
# a DEV DCM target. `terraform/env/qa/` and `terraform/env/prod/` are scaffolded Terraform
# tfvars/backend configs for a future rollout, but are not wired into any pipeline yet —
# adding TEST/UAT/PROD means repeating this exact pattern per environment: a new GitHub
# Environment pair, a new OIDC identity pair in terraform/oidc_service_user.tf, and a new
# dcm/manifest.yml target, matching the identity-isolation model in
# MDP_Platform_Engineering_CICD_IaC_Repo_Architecture_v0.1.md §1.

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "dcm/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment:
      name: DEV-Terraform

    env:
      TF_VAR_snowflake_organization_name: xygpmhm
      TF_VAR_snowflake_account_name: gq04150
      TARGET_ENV: dev

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::525218385225:role/snowflake-platform-tf-github-oidc
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Fetch Snowflake OIDC token
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=snowflakecomputing.com" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "SNOWFLAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init -backend-config="env/${{ env.TARGET_ENV }}/backend.hcl"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -var-file="env/${{ env.TARGET_ENV }}/${{ env.TARGET_ENV }}.tfvars" -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n\n...output truncated' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan (${process.env.TARGET_ENV})\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # Runs in parallel with the Terraform plan job (no `needs:`) — plan is always read-only
  # in both engines, so DCM's plan preview doesn't depend on Terraform's plan finishing
  # first. Only *apply/deploy* is sequential (see dcm-deploy's `needs: apply` in
  # terraform-apply.yml) because that's where the real "Terraform must complete first"
  # ordering constraint applies. Matches the architecture doc's pipeline diagram
  # (PR → TFPlan, PR → DCMPlan, both → Review) and the reference implementation.
  dcm-plan:
    name: DCM Plan
    runs-on: ubuntu-latest
    environment:
      name: DEV-DCM

    env:
      SNOWFLAKE_ACCOUNT: xygpmhm-gq04150
      SNOWFLAKE_USER: GITHUB_DEV_DCM_SVC
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC

    defaults:
      run:
        working-directory: dcm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Create default Snowflake CLI connection (OIDC)
        run: |
          snow connection add \
            --connection-name github \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --role SYSADMIN \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --default \
            --no-interactive

      # `snow dcm plan`/`deploy` require the DCM Project object itself to already exist —
      # --if-not-exists makes this safe to run on every plan, including the very first one.
      - name: Create DCM project (idempotent)
        run: snow dcm create --target DEV --if-not-exists

      - name: DCM Plan
        id: dcm_plan
        run: snow dcm plan --target DEV 2>&1 | tee dcm_plan_output.txt
        continue-on-error: true

      - name: Post DCM plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('dcm/dcm_plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n\n...output truncated' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## DCM Plan (DEV)\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Fail if DCM plan failed
        if: steps.dcm_plan.outcome == 'failure'
        run: exit 1
