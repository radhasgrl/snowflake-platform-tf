name: TEMP - State Migration (DEV to TEST)

# ONE-OFF, TEMPORARY workflow. Delete this file once the migration below has run
# successfully exactly once. Do not add this to branch protection or any trigger other
# than manual dispatch.
#
# Purpose: the TEST-tier Terraform resources (GITHUB_TEST_TERRAFORM_SVC, GITHUB_TEST_DCM_SVC,
# TEST_ADMIN_DB, Customer's TEST-tier dbt/ingest identities) were created by a regular
# `terraform apply` against the DEV backend, so they physically live in
# workload/dev/terraform.tfstate today, not workload/test/terraform.tfstate -- even though
# they're genuinely TEST-tier Snowflake objects. This workflow moves their STATE ENTRIES
# (not the real Snowflake objects, which are untouched) from the DEV state into the TEST
# state, so a future `terraform apply` against env/test/ can manage them going forward.
# Uses the same AWS OIDC role terraform-plan.yml/terraform-apply.yml already use for S3
# backend access -- this is the one shared backend-access role for the whole repo
# (one AWS account, one state bucket, three state keys), not a DEV-specific credential.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    name: Move TEST-tier state entries from DEV to TEST backend
    runs-on: ubuntu-latest
    environment:
      name: TEST-Terraform

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::525218385225:role/snowflake-platform-tf-github-oidc
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Init against DEV backend (source of the TEST-tier entries today)
        run: terraform init -backend-config="env/dev/backend.hcl"

      - name: Move TEST-tier resources out of DEV state into a local staging file
        run: |
          set -euo pipefail
          OUT=/tmp/test-migrated.tfstate
          terraform state mv -state-out="$OUT" 'snowflake_execute.github_test_terraform_service_user' 'snowflake_execute.github_test_terraform_service_user'
          terraform state mv -state-out="$OUT" 'snowflake_grant_account_role.github_test_terraform_sysadmin' 'snowflake_grant_account_role.github_test_terraform_sysadmin'
          terraform state mv -state-out="$OUT" 'snowflake_grant_account_role.github_test_terraform_useradmin' 'snowflake_grant_account_role.github_test_terraform_useradmin'
          terraform state mv -state-out="$OUT" 'snowflake_grant_account_role.github_test_terraform_securityadmin' 'snowflake_grant_account_role.github_test_terraform_securityadmin'
          terraform state mv -state-out="$OUT" 'snowflake_execute.github_test_dcm_service_user' 'snowflake_execute.github_test_dcm_service_user'
          terraform state mv -state-out="$OUT" 'snowflake_execute.github_test_dcm_service_user_defaults' 'snowflake_execute.github_test_dcm_service_user_defaults'
          terraform state mv -state-out="$OUT" 'snowflake_grant_account_role.github_test_dcm_sysadmin' 'snowflake_grant_account_role.github_test_dcm_sysadmin'
          terraform state mv -state-out="$OUT" 'snowflake_grant_account_role.github_test_dcm_useradmin' 'snowflake_grant_account_role.github_test_dcm_useradmin'
          terraform state mv -state-out="$OUT" 'snowflake_grant_account_role.github_test_dcm_securityadmin' 'snowflake_grant_account_role.github_test_dcm_securityadmin'
          terraform state mv -state-out="$OUT" 'snowflake_database.admin_test' 'snowflake_database.admin_test'
          terraform state mv -state-out="$OUT" 'snowflake_schema.admin_test_dcm' 'snowflake_schema.admin_test_dcm'
          terraform state mv -state-out="$OUT" 'module.domain_onboarding_test.snowflake_execute.domain_dbt_service_user["customer"]' 'module.domain_onboarding_test.snowflake_execute.domain_dbt_service_user["customer"]'
          terraform state mv -state-out="$OUT" 'module.domain_onboarding_test.snowflake_execute.domain_ingest_service_user["customer"]' 'module.domain_onboarding_test.snowflake_execute.domain_ingest_service_user["customer"]'
          echo "--- Staged state file now contains: ---"
          terraform state list -state="$OUT"

      - name: Confirm TEST-tier resources are gone from DEV state
        run: |
          echo "--- Remaining DEV state (should contain NO github_test_*, admin_test, or domain_onboarding_test entries): ---"
          terraform state list

      - name: Re-init against TEST backend (destination)
        run: terraform init -backend-config="env/test/backend.hcl" -reconfigure

      - name: Push staged state into the TEST backend
        run: |
          terraform state push /tmp/test-migrated.tfstate
          echo "--- TEST backend now contains: ---"
          terraform state list
