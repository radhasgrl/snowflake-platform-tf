name: Promote to Environment

# Deliberately workflow_dispatch-only -- promotion is always a manual, deliberate action,
# never automatic. Checks out an EXACT tagged release (not whatever main currently is, see
# release-please.yml for how tags get created) and deploys DCM's domain TEST/PROD target,
# gated by that environment's GitHub Environment required-reviewer protection rule.
#
# Terraform-managed platform resources (OIDC identities, admin databases) are deliberately
# NOT part of this workflow. Unlike DCM's domain content -- which genuinely changes release
# to release as a domain's schemas/warehouses/roles evolve -- this repo's Terraform
# resources are rarely-changing platform scaffolding (identities, admin DBs) created once
# via the regular, continuous DEV pipeline (terraform-apply.yml). Confirmed: var.environment
# / local.env (context.tf) are not referenced by any resource in this codebase -- Terraform
# here has no environment-conditional behavior to promote; every environment's identities
# are created unconditionally by the one shared DEV pipeline.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Git tag to promote, e.g. v1.1.0 (see the repo's Releases page)"
        required: true
        type: string
      target_environment:
        description: "Environment to promote to"
        required: true
        type: choice
        options:
          - TEST
        # PROD intentionally not listed yet -- no PROD identities, DCM target, or GitHub
        # Environment exist today. Adding PROD is the same pattern as TEST, repeated.

permissions:
  contents: read
  id-token: write

jobs:
  # Hardcoded to the Customer domain for now -- the only domain with a TEST target today
  # (dcm/domains/customer/manifest.yml's CUSTOMER_TEST target). Generalizing this into a
  # matrix (one job per domain with a target for the chosen environment) is the natural
  # next step once a second domain is onboarded to TEST, mirroring dcm-plan.yml/
  # dcm-deploy.yml's existing detect-domains + matrix pattern.
  promote-customer-dcm:
    name: Promote Customer DCM (${{ inputs.target_environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target_environment }}-DCM

    env:
      SNOWFLAKE_ACCOUNT: xygpmhm-gq04150
      SNOWFLAKE_USER: GITHUB_${{ inputs.target_environment }}_DCM_SVC
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC

    defaults:
      run:
        working-directory: dcm

    steps:
      - name: Checkout exact tagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Setup Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Create default Snowflake CLI connection (OIDC)
        run: |
          snow connection add \
            --connection-name github \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --role SYSADMIN \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --default \
            --no-interactive

      # Same rationale as dcm-plan.yml/dcm-deploy.yml's identical step: this identity is
      # created by Terraform (terraform/domains_test.yaml / oidc_service_user.tf), not by
      # this workflow -- fails fast with an actionable message if it doesn't exist yet.
      - name: Verify ${{ inputs.target_environment }} DCM identity is ready
        run: |
          if ! snow sql -q "SELECT CURRENT_USER();" >/tmp/dcm_identity_check.log 2>&1; then
            echo "::error::Could not authenticate as $SNOWFLAKE_USER. Has Terraform created this identity yet? See terraform/oidc_service_user.tf / terraform/domains_test.yaml."
            cat /tmp/dcm_identity_check.log
            exit 1
          fi

      # Synthesizes dcm/domains/customer/sources/ from dcm/sources/ at the checked-out
      # tag's content -- same mechanism as dcm-plan.yml/dcm-deploy.yml, just against a
      # pinned historical ref instead of the current main tip.
      - name: Synthesize customer domain sources
        run: bash sync-domain.sh customer

      - name: Create DCM project (idempotent)
        run: snow dcm create --target CUSTOMER_${{ inputs.target_environment }} --from domains/customer --if-not-exists

      - name: DCM Deploy
        run: snow dcm deploy --target CUSTOMER_${{ inputs.target_environment }} --from domains/customer

      - name: Summary
        run: echo "::notice::Promoted Customer domain ${{ inputs.version }} to ${{ inputs.target_environment }}"
