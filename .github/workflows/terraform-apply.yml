name: Terraform Apply

# Deliberately DEV-only for this demo — see the matching comment at the top of
# terraform-plan.yml for why there is no environment dropdown here.

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "dcm/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment:
      name: DEV-Terraform

    env:
      TF_VAR_snowflake_organization_name: xygpmhm
      TF_VAR_snowflake_account_name: gq04150
      TARGET_ENV: dev

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::525218385225:role/snowflake-platform-tf-github-oidc
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Fetch Snowflake OIDC token
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=snowflakecomputing.com" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "SNOWFLAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init -backend-config="env/${{ env.TARGET_ENV }}/backend.hcl"

      - name: Terraform Apply
        run: terraform apply -var-file="env/${{ env.TARGET_ENV }}/${{ env.TARGET_ENV }}.tfvars" -auto-approve

  # DCM deploy runs after Terraform apply — the platform/account layer (identities, OIDC)
  # must exist before DCM can authenticate and deploy the object layer. Kept as a second
  # job in the same workflow rather than a separate pipeline, per the single-pipeline
  # design rule in MDP_Platform_Engineering_CICD_IaC_Repo_Architecture_v0.1.md §2.6.
  account-deploy:
    name: DCM Deploy (account)
    runs-on: ubuntu-latest
    needs: apply
    environment:
      name: DEV-DCM

    env:
      SNOWFLAKE_ACCOUNT: xygpmhm-gq04150
      SNOWFLAKE_USER: GITHUB_DEV_DCM_SVC
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC

    defaults:
      run:
        working-directory: dcm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Create default Snowflake CLI connection (OIDC)
        run: |
          snow connection add \
            --connection-name github \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --role SYSADMIN \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --default \
            --no-interactive

      # `snow dcm deploy`/`plan` require the DCM Project object itself to already exist —
      # unlike `CREATE USER IF NOT EXISTS`-style idempotency elsewhere, DCM has a separate
      # create step. --if-not-exists makes this safe to run on every deploy.
      - name: Create DCM project (idempotent)
        run: snow dcm create --target ACCOUNT --from account --if-not-exists

      - name: DCM Deploy
        run: snow dcm deploy --target ACCOUNT --from account

  detect-domains:
    name: Detect Changed Domains
    runs-on: ubuntu-latest
    needs: apply
    outputs:
      domains: ${{ steps.detect.outputs.domains }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only domains listed in dcm/active_domains.json ever get a job here — see the
      # matching comment in terraform-plan.yml's detect-domains job.
      - name: Detect which domains changed
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DOMAINS=$(bash dcm/detect-changed-domains.sh ALL)
          else
            DOMAINS=$(bash dcm/detect-changed-domains.sh "${{ github.event.before }}" "${{ github.sha }}")
          fi
          echo "Domains to deploy: $DOMAINS"
          echo "domains=$DOMAINS" >> "$GITHUB_OUTPUT"

  dcm-deploy:
    name: DCM Deploy (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: detect-domains
    if: needs.detect-domains.outputs.domains != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-domains.outputs.domains) }}
    environment:
      name: DEV-DCM

    env:
      SNOWFLAKE_ACCOUNT: xygpmhm-gq04150
      SNOWFLAKE_USER: GITHUB_DEV_DCM_SVC
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC

    defaults:
      run:
        working-directory: dcm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Create default Snowflake CLI connection (OIDC)
        run: |
          snow connection add \
            --connection-name github \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --role SYSADMIN \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --default \
            --no-interactive

      # Synthesizes dcm/domains/<domain>/sources/ from dcm/_template/ (see
      # dcm/sync-domain.sh) — this is what keeps domain onboarding at zero duplicated SQL.
      # Never committed; regenerated fresh on every run.
      - name: Synthesize ${{ matrix.name }} domain sources
        run: bash sync-domain.sh ${{ matrix.name }}

      # `snow dcm deploy`/`plan` require the DCM Project object itself to already exist —
      # unlike `CREATE USER IF NOT EXISTS`-style idempotency elsewhere, DCM has a separate
      # create step. --if-not-exists makes this safe to run on every deploy.
      - name: Create DCM project (idempotent)
        run: snow dcm create --target ${{ matrix.target }} --from domains/${{ matrix.name }} --if-not-exists

      - name: DCM Deploy
        run: snow dcm deploy --target ${{ matrix.target }} --from domains/${{ matrix.name }}
