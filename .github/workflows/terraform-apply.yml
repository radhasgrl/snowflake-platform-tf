name: Terraform Apply

# Terraform runs FIRST, DCM runs SECOND, always, one after another -- per client
# direction. dcm-deploy.yml now triggers via `workflow_run` on THIS workflow's completion,
# gated on success (`if: github.event.workflow_run.conclusion == 'success'`), guaranteeing
# DCM never deploys without a confirmed-successful Terraform apply immediately before it.
# This replaces the earlier "Verify DCM identity is ready" fail-fast check in dcm-deploy.yml
# -- that was a workaround for the lack of a real ordering guarantee; now there is one.
#
# Path filter includes dcm/** as well as terraform/** so a DCM-only push also runs
# Terraform Apply first, giving dcm-deploy.yml something to chain from. Unlike the plan
# side, this needs no Checks API workaround -- by the time a push to main happens, the PR
# is already merged and required checks already passed, so there's no PR left to gate.

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "dcm/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment:
      name: DEV-Terraform

    env:
      TF_VAR_snowflake_organization_name: xygpmhm
      TF_VAR_snowflake_account_name: gq04150
      TARGET_ENV: dev

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::525218385225:role/snowflake-platform-tf-github-oidc
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Fetch Snowflake OIDC token
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=snowflakecomputing.com" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "SNOWFLAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init -backend-config="env/${{ env.TARGET_ENV }}/backend.hcl"

      - name: Terraform Apply
        run: terraform apply -var-file="env/${{ env.TARGET_ENV }}/${{ env.TARGET_ENV }}.tfvars" -auto-approve
