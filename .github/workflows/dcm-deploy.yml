name: DCM Deploy

# Terraform runs FIRST, DCM runs SECOND -- per client direction. This workflow is triggered
# by terraform-apply.yml FINISHING (`workflow_run`), guarded by
# `if: github.event.workflow_run.conclusion == 'success'`, so DCM Deploy can never run
# without a confirmed-successful Terraform Apply immediately before it. This replaces the
# earlier "Verify DCM identity is ready" fail-fast check -- that was a workaround for the
# lack of a real ordering guarantee; now there is one.
#
# Unlike dcm-plan.yml, this needs no Checks API workaround: by the time a push to main
# happens, the PR is already merged and required checks already passed, so there's no PR
# left to gate -- the workflow_run limitation (results invisible to a PR) simply doesn't
# apply here.
#
# Also simplified from a per-domain matrix to ONE sequential job (per client direction) --
# see dcm-plan.yml's header comment for the full rationale (matrix job names can't be
# required checks anyway, and that's moot here, but the simplification applies equally).

on:
  workflow_run:
    workflows: ["Terraform Apply"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  dcm-deploy:
    name: DCM Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: DEV-DCM

    env:
      SNOWFLAKE_ACCOUNT: xygpmhm-gq04150
      SNOWFLAKE_USER: GITHUB_DEV_DCM_SVC
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC

    defaults:
      run:
        working-directory: dcm

    steps:
      # workflow_run gives the exact commit that triggered Terraform Apply -- for a push
      # event (the only realistic trigger here), that's always main's new tip. Runs before
      # checkout, so it must override the job's dcm/ default working-directory (which
      # doesn't exist on disk yet at this point).
      - name: Resolve head commit to deploy
        id: resolve
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "head_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # workflow_run's payload has no equivalent of push's `github.event.before` (the
      # previous tip of main) -- confirmed via GitHub's own event schema. With full git
      # history available (fetch-depth: 0 above) and this repo's enforced linear history
      # (required_linear_history, see branch protection), the immediate parent commit is
      # exactly the previous tip for workflow_dispatch and for the realistic case here
      # (one merge = one new commit on main).
      - name: Resolve base commit for diffing
        id: base
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "base_sha=0000000000000000000000000000000000000000" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=$(git rev-parse ${{ steps.resolve.outputs.head_sha }}^)" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Create default Snowflake CLI connection (OIDC)
        run: |
          snow connection add \
            --connection-name github \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --role SYSADMIN \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --default \
            --no-interactive

      # Only domains listed in dcm/active_domains.json ever get deployed below -- see the
      # matching comment in dcm-plan.yml.
      - name: Detect which domains changed
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DOMAINS=$(bash detect-changed-domains.sh ALL)
          else
            DOMAINS=$(bash detect-changed-domains.sh "${{ steps.base.outputs.base_sha }}" "${{ steps.resolve.outputs.head_sha }}")
          fi
          echo "Domains to deploy: $DOMAINS"
          echo "domains=$DOMAINS" >> "$GITHUB_OUTPUT"

      # Sequential loop replacing the old per-domain matrix -- each domain is still
      # synthesized from dcm/sources/ and deployed independently; one domain's failure
      # doesn't stop the loop from still attempting every other domain.
      - name: Deploy each changed domain
        run: |
          OVERALL_STATUS=0
          for row in $(echo '${{ steps.detect.outputs.domains }}' | jq -c '.[]'); do
            NAME=$(echo "$row" | jq -r '.name')
            TARGET=$(echo "$row" | jq -r '.target')
            echo "::group::DCM Deploy - $NAME"
            bash sync-domain.sh "$NAME"
            snow dcm create --target "$TARGET" --from "domains/$NAME" --if-not-exists
            if ! snow dcm deploy --target "$TARGET" --from "domains/$NAME"; then
              OVERALL_STATUS=1
            fi
            echo "::endgroup::"
          done
          exit $OVERALL_STATUS
