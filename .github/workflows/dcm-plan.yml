name: DCM Plan

# Terraform runs FIRST, DCM runs SECOND -- per client direction. This workflow is triggered
# by terraform-plan.yml FINISHING (`workflow_run`), not directly by the pull_request event,
# guaranteeing DCM never plans without a confirmed-successful Terraform Plan immediately
# before it. This replaces the earlier "Verify DCM identity is ready" fail-fast check --
# that was a workaround for the lack of a real ordering guarantee; now there is one.
#
# KNOWN GITHUB LIMITATION this workflow has to work around: a workflow triggered by
# `workflow_run` does NOT automatically show up as a PR check, and cannot satisfy a
# required branch-protection status check (confirmed in GitHub's own docs -- only
# push/pull_request/pull_request_review/pull_request_target/deployment(_status)-triggered
# workflows can). So this workflow manually creates and updates its own check run via the
# Checks API (`github.rest.checks.create`/`update`), tied to the exact PR commit SHA
# (`github.event.workflow_run.head_sha`) -- the standard, documented pattern for this exact
# problem, not a workaround invented here.
#
# Also simplified from a per-domain matrix to ONE sequential job (per client direction):
# every domain is instantiated from the same dcm/sources/ template, and a matrix job's
# dynamically-generated name (DCM Plan (customer), DCM Plan (procurement), ...) can never
# be registered as a required status check -- GitHub can't express "require whichever of
# these dynamically-named jobs happened to run", the same class of problem as the
# workflow_run limitation above, just for a different reason. One job, looping through
# however many domains dcm/detect-changed-domains.sh decided need replanning, has one
# fixed name ("DCM Plan") -- so it can be the required check directly, with no separate
# fan-in/gate job needed.

on:
  workflow_run:
    workflows: ["Terraform Plan"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

jobs:
  # Runs ONLY when Terraform Plan itself failed -- reports DCM Plan as failed immediately,
  # without ever touching Snowflake, so the PR isn't left stuck waiting for a check that
  # was never going to be posted. See this file's header comment for why a check run must
  # be posted even in this "we're not really running DCM" case.
  terraform-plan-failed:
    name: DCM Plan (skipped - Terraform Plan failed)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    permissions:
      checks: write
    steps:
      - name: Report DCM Plan as failed
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'DCM Plan',
              head_sha: context.payload.workflow_run.head_sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Skipped -- Terraform Plan failed',
                summary: 'DCM Plan did not run because the preceding Terraform Plan run failed. Terraform must complete successfully before DCM plans, per the required run order. See the Terraform Plan run for the actual failure.',
              },
            });

  dcm-plan:
    name: DCM Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: DEV-DCM

    env:
      SNOWFLAKE_ACCOUNT: xygpmhm-gq04150
      SNOWFLAKE_USER: GITHUB_DEV_DCM_SVC
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC

    defaults:
      run:
        working-directory: dcm

    steps:
      # Resolves which commit/PR this run is actually about. workflow_run gives us the
      # triggering commit's SHA directly; the enclosing PR (needed for posting comments
      # and diffing changed files) is looked up via the Commits API rather than trusting
      # workflow_run's own `pull_requests` payload field, which is known to be unreliable
      # in some timing/fork scenarios.
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'workflow_run') {
              core.setOutput('head_sha', context.sha);
              core.setOutput('base_sha', '0000000000000000000000000000000000000000');
              core.setOutput('pr_number', '');
              return;
            }
            const headSha = context.payload.workflow_run.head_sha;
            core.setOutput('head_sha', headSha);
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha,
            });
            if (prs.length > 0) {
              core.setOutput('base_sha', prs[0].base.sha);
              core.setOutput('pr_number', String(prs[0].number));
            } else {
              core.setOutput('base_sha', '0000000000000000000000000000000000000000');
              core.setOutput('pr_number', '');
            }

      - name: Create in-progress check run
        id: check
        if: steps.pr.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'DCM Plan',
              head_sha: '${{ steps.pr.outputs.head_sha }}',
              status: 'in_progress',
            });
            core.setOutput('check_id', check.data.id);

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Create default Snowflake CLI connection (OIDC)
        run: |
          snow connection add \
            --connection-name github \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --role SYSADMIN \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --default \
            --no-interactive

      # Only domains listed in dcm/active_domains.json ever get planned below -- a domain
      # whose manifest.yml exists but isn't "active" (e.g. a deliberately-not-yet-deployed
      # template like Procurement) never runs, no matter what changed. This is what keeps
      # CI load flat as domains scale into the hundreds: a PR touching one domain's folder
      # doesn't replan every other domain too.
      - name: Detect which domains changed
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DOMAINS=$(bash detect-changed-domains.sh ALL)
          else
            DOMAINS=$(bash detect-changed-domains.sh "${{ steps.pr.outputs.base_sha }}" "${{ steps.pr.outputs.head_sha }}")
          fi
          echo "Domains to plan: $DOMAINS"
          echo "domains=$DOMAINS" >> "$GITHUB_OUTPUT"

      # Sequential loop replacing the old per-domain matrix (see header comment) -- each
      # domain is still synthesized from dcm/sources/ and planned independently;
      # set -o pipefail + PIPESTATUS ensures one domain's failure doesn't get masked by
      # tee's own always-0 exit code, and doesn't stop the loop from still attempting
      # every other domain (so one failing domain's output is never hidden).
      - name: Plan each changed domain
        id: plan_all
        run: |
          set -o pipefail
          OVERALL_STATUS=0
          : > all_domains_plan_output.txt
          for row in $(echo '${{ steps.detect.outputs.domains }}' | jq -c '.[]'); do
            NAME=$(echo "$row" | jq -r '.name')
            TARGET=$(echo "$row" | jq -r '.target')
            echo "::group::DCM Plan - $NAME"
            bash sync-domain.sh "$NAME"
            snow dcm create --target "$TARGET" --from "domains/$NAME" --if-not-exists
            {
              echo "=== $NAME ($TARGET) ==="
              snow dcm plan --target "$TARGET" --from "domains/$NAME" 2>&1
            } | tee -a all_domains_plan_output.txt
            DOMAIN_STATUS=${PIPESTATUS[0]}
            if [ "$DOMAIN_STATUS" -ne 0 ]; then
              OVERALL_STATUS=1
            fi
            echo "::endgroup::"
          done
          exit $OVERALL_STATUS
        continue-on-error: true

      - name: Post plan comment and update check run
        if: steps.pr.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = 'No active domains needed planning this run.';
            try {
              plan = fs.readFileSync('dcm/all_domains_plan_output.txt', 'utf8');
            } catch (e) {}
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n\n...output truncated' : plan;

            await github.rest.issues.createComment({
              issue_number: parseInt('${{ steps.pr.outputs.pr_number }}', 10),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## DCM Plan (DEV)\n\`\`\`\n${truncated}\n\`\`\``,
            });

            const passed = '${{ steps.plan_all.outcome }}' === 'success';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: ${{ steps.check.outputs.check_id }},
              status: 'completed',
              conclusion: passed ? 'success' : 'failure',
            });

      - name: Fail if any domain's plan failed
        if: steps.plan_all.outcome == 'failure'
        run: exit 1
