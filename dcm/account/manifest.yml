manifest_version: 2
type: DCM_PROJECT

default_target: ACCOUNT

# Account-level DCM project — genuinely platform-wide, never repeated per domain (unlike
# dcm/domains/<domain>/, which is instantiated once per domain from dcm/sources/). This
# is a single, hand-written, non-templated project, matching the infra-platform reference's
# own dcm/manifest.yml (account_warehouses: DEPLOY/PLATFORM) — the reference doesn't
# template its account-level project either, since there's only ever one of it.
targets:
  ACCOUNT:
    project_name: DEV_ADMIN_DB.DCM.ACCOUNT_DCM
    account_identifier: xygpmhm-gq04150
