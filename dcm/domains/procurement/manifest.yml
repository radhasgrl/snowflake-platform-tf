manifest_version: 2
type: DCM_PROJECT

default_target: PROCUREMENT

targets:
  # Brand-new domain — no pre-existing objects to preserve, so (unlike Customer) this gets
  # its own brand-new DCM project. This is the safe, documented path: DCM "adopting" objects
  # that don't exist yet, rather than re-homing already-managed objects between projects.
  #
  # NOT YET DEPLOYED. This manifest exists as a ready-to-use template proving the domain
  # pattern generalizes beyond Customer — see dcm/_template/_validate_render.py for a
  # Snowflake-free check that it renders cleanly. Onboarding this domain for real is just:
  # (1) add a `dcm-deploy-procurement` job to terraform-apply.yml/-plan.yml (copy
  # the Customer job, swap CUSTOMER -> PROCUREMENT), (2) create the
  # GITHUB_DEV_PROCUREMENT_DBT_SVC / GITHUB_DEV_PROCUREMENT_INGEST_SVC identities in
  # oidc_service_user.tf, (3) run it.
  PROCUREMENT:
    project_name: DEV_ADMIN_DB.DCM.PROCUREMENT_DCM
    account_identifier: xygpmhm-gq04150
    templating_config: PROCUREMENT

templating:
  configurations:
    PROCUREMENT:
      env: DEV
      domain: PROCUREMENT
      domain_comment: "Procurement domain — raw, staging, marts and shared objects for this domain"
      policy_schema: SHARED

      # Per-domain workload warehouses (Tier 4) — not shared with any other domain, same as
      # every other domain in this platform.
      warehouses:
        - purpose: INGEST
          size: XSMALL
          auto_suspend: 60
          comment: "Data loading and ingestion workloads"
        - purpose: TRANSFORM
          size: XSMALL
          auto_suspend: 120
          comment: "dbt transformations and ELT workloads"
        - purpose: REPORTING
          size: XSMALL
          auto_suspend: 60
          comment: "BI tools and ad-hoc reporting queries"

      schemas:
        - name: RAW
          comment: "Landing zone for Snowpipe ingestion (Repo 2, data-ingestion-raw)"
          write_create_privileges: "CREATE STAGE, CREATE FILE FORMAT, CREATE PIPE"
        - name: STAGING
          comment: "Intermediate dbt models (Repo 3b, procurement-domain-dbt)"
          write_create_privileges: "CREATE VIEW"
        - name: MARTS
          comment: "Final business-facing data marts for the Procurement domain"
          write_create_privileges: "CREATE TABLE"
          w_comment_suffix: " - dbt builds fct_purchase_orders here"
        - name: SHARED
          comment: "Shared UDFs, procedures and reference data for the Procurement domain"
          read_only: true
          r_comment_suffix: " (shared UDFs/procedures)"

      personas:
        - name: DATA_ENGINEER
          comment: "engineers who land and maintain Procurement domain RAW data"
          functional_roles: [INGEST]
          extra_warehouse_grants:
            - {purpose: INGEST, level: O}
        - name: DATA_ANALYST
          comment: "analysts who query Procurement domain curated marts"
          functional_roles: [READER]
        - name: DATA_CONSUMER
          comment: "downstream/BI consumers of Procurement domain curated marts"
          functional_roles: [READER]
        - name: DBT_SERVICE
          comment: "the dbt service identity (Repo 3b, procurement-domain-dbt) that runs Procurement domain transformations"
          oidc_user: GITHUB_DEV_PROCUREMENT_DBT_SVC
          functional_roles: [TRANSFORM]
        - name: INGEST_SERVICE
          comment: "the Snowpipe ingestion service identity (Repo 2, data-ingestion-raw) that loads Procurement domain RAW data"
          oidc_user: GITHUB_DEV_PROCUREMENT_INGEST_SVC
          functional_roles: [INGEST]

      functional_roles:
        - name: INGEST
          comment: "land data into Procurement domain RAW"
          database_role_grants:
            - {schema: RAW, level: W}
          warehouse_grants:
            - {purpose: INGEST, level: U}
          needs_create_integration: true
        - name: TRANSFORM
          comment: "read RAW/SHARED, read-write STAGING for the Procurement domain"
          database_role_grants:
            - {schema: RAW, level: R}
            - {schema: STAGING, level: W}
            - {schema: MARTS, level: W}
            - {schema: SHARED, level: R}
          warehouse_grants:
            - {purpose: TRANSFORM, level: U}
          needs_create_schema: true
        - name: READER
          comment: "read Procurement domain curated MARTS"
          database_role_grants:
            - {schema: MARTS, level: R}
          warehouse_grants:
            - {purpose: REPORTING, level: U}

      tables:
        - schema: RAW
          name: PURCHASE_ORDERS
          comment: "Raw landing table for purchase order records, loaded by the Snowpipe ingestion pipeline"
          columns:
            - {name: PURCHASE_ORDER_ID, type: NUMBER, comment: "Unique purchase order identifier"}
            - {name: VENDOR_NAME, type: VARCHAR, comment: "Supplier/vendor name"}
            - {name: ORDER_DATE, type: DATE, comment: "Date the purchase order was placed"}
            - {name: TOTAL_AMOUNT, type: NUMBER(12,2), comment: "Total purchase order value"}
            - {name: STATUS, type: VARCHAR, comment: "Purchase order status (e.g. OPEN, RECEIVED, CLOSED)"}
